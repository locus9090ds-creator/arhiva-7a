<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arhiva clasei 7A scoala nr 31</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-top: 20px;
        }
        .upload-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            margin-bottom: 30px;
        }
        input[type="file"] {
            margin-bottom: 10px;
        }
        button.upload-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button.upload-btn:hover {
            background-color: #2980b9;
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        #progress {
            margin-top: 10px;
            font-weight: bold;
            color: #27ae60;
            display: none;
        }
        .section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .media-wrapper {
            position: relative;
            width: 100%;
            height: 250px;
        }
        .media-grid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
            background-color: #eee;
        }
    </style>
</head>
<body>

    <h1>Arhiva clasei 7A scoala nr 31</h1>

    <div class="upload-card">
        <h3>Adaugă o poză</h3>
        <input type="file" id="fileInput" accept="image/*">
        <br>
        <button id="uploadBtn" class="upload-btn">Încarcă (Max 10MB)</button>
        <div id="progress">Se încarcă...</div>
    </div>

    <div class="section">
        <h2>Poze & Screenshots</h2>
        <div class="media-grid" id="photos-section"></div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const progressText = document.getElementById('progress');
        const photosSection = document.getElementById('photos-section');

        const MAX_SIZE = 10 * 1024 * 1024; // 10MB limit

        let savedPhotos = JSON.parse(localStorage.getItem('class_photos') || '[]');
        renderPhotos();

        uploadBtn.addEventListener('click', async () => {
            const file = fileInput.files[0];
            if (!file) {
                alert("Te rog selectează o poză!");
                return;
            }

            if (file.size > MAX_SIZE) {
                alert("Poza este prea mare! Limita maximă este de 10MB.");
                return;
            }

            if (!file.type.startsWith('image/')) {
                alert("Se acceptă doar fișiere de tip poză!");
                return;
            }

            progressText.style.display = 'block';
            uploadBtn.disabled = true;
            progressText.innerText = "Se încarcă...";

            try {
                const formData = new FormData();
                formData.append('source', file);
                formData.append('type', 'file');
                formData.append('action', 'upload');
                formData.append('key', '6d207e02198a847aa98d0a2a901485a5'); 

                const response = await fetch('https://freeimage.host/api/1/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.status_code === 200) {
                    const imageUrl = data.image.url;
                    
                    savedPhotos.unshift(imageUrl);
                    localStorage.setItem('class_photos', JSON.stringify(savedPhotos));

                    renderPhotos();
                    progressText.innerText = "Încărcat cu succes!";
                    fileInput.value = '';
                } else {
                    throw new Error("Eroare de la serverul de imagini.");
                }
            } catch (error) {
                console.error(error);
                alert("A apărut o eroare la încărcarea pozei.");
            } finally {
                progressText.style.display = 'none';
                uploadBtn.disabled = false;
            }
        });

        function renderPhotos() {
            photosSection.innerHTML = '';
            if (savedPhotos.length === 0) {
                photosSection.innerHTML = '<p style="color: #777; grid-column: 1/-1; text-align: center;">Nicio poză încărcată încă.</p>';
                return;
            }

            savedPhotos.forEach((url) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'media-wrapper';

                const img = document.createElement('img');
                img.src = url;
                img.loading = "lazy";
                wrapper.appendChild(img);

                photosSection.appendChild(wrapper);
            });
        }
    </script>
</body>
</html>
